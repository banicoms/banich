<!doctype html><meta charset="utf-8"><title>Banich 6.0 check</title>
<style>body {direction:ltr} #layout{display:flex;gap:20px;width:600px} .card{width:200px} p{text-align:left}</style>
<div id="layout"><section class="card"><p id="fa">سلام دنیا</p><p id="en">Hello world</p><p id="ar">مرحبا بالعالم</p><p id="ku">سڵاو جیهان</p><p id="ps">پښتو ژبه</p><p id="mix">Hello سلام</p><span class="icon" id="icon">سلام</span></section><section class="card" id="position">Window</section></div>
<input id="field" value="سلام"><input id="email" type="email" value="test@example.com"><code id="code">سلام</code><div id="dynamic"></div><pre id="result">Running</pre>
<ul id="bullets"><li id="bullet-fa"><p>تیتر فارسی با <a href="#">پیوند</a></p><ul><li id="nested-en">English nested item</li></ul></li><li id="bullet-en"><p>English item</p><ul><li id="nested-fa">گزینه فارسی</li></ul></li></ul>
<ol><li id="number-fa"><p>عنوان شماره‌دار فارسی</p></li></ol>
<script>
(async () => {
  const listeners = [];
  window.chrome = {
    runtime: {onMessage:{addListener:f=>listeners.push(f)},sendMessage:(m,cb)=>cb({origin:location.origin}),getURL:p=>new URL('../'+p,location.href).href},
    storage:{onChanged:{addListener:()=>{}},local:{get:(keys,cb)=>cb({})}}
  };
  const source = await (await fetch('../content.js')).text();
  const check = (ok, label) => {if(!ok) throw Error(label)};
  const position = document.querySelector('#position').getBoundingClientRect().x;
  const original = document.querySelector('#fa').firstChild;
  (0,eval)(source);
  const apply = settings => listeners[0]({type:'BANICH_APPLY',origin:location.origin,settings},{},()=>{});
  const tick = () => new Promise(resolve=>setTimeout(resolve,300));
  apply({font:true,rtl:true});
  for(const id of ['fa','ar','ku','ps']) {
    check(getComputedStyle(document.querySelector('#'+id)).direction==='rtl',id+' RTL');
    check(getComputedStyle(document.querySelector('#'+id)).textAlign==='right',id+' align');
  }
  for (const id of ['bullet-fa','number-fa','nested-fa']) check(getComputedStyle(document.getElementById(id)).direction==='rtl', id+' marker RTL');
  for (const id of ['bullet-en','nested-en']) check(getComputedStyle(document.getElementById(id)).direction==='ltr', id+' marker LTR');
  check(getComputedStyle(document.getElementById('bullets')).direction==='ltr','List container unchanged');
  check(!document.querySelector('#en[data-banich-rtl]'),'English unchanged');
  check(!document.querySelector('#icon span'),'Icon unchanged');
  check(!document.querySelector('#code span'),'Code unchanged');
  check(getComputedStyle(document.querySelector('#mix')).direction==='ltr','Mixed first strong Latin stays LTR');
  check(getComputedStyle(document.querySelector('#layout')).direction==='ltr','Layout direction unchanged');
  check(position===document.querySelector('#position').getBoundingClientRect().x,'Window position unchanged');
  check(getComputedStyle(document.querySelector('#field')).direction==='rtl','Persian field');
  check(!document.querySelector('[data-banich-text]'),'No wrappers created');
  const mixed = document.createElement('p');
  mixed.innerHTML='پاراگراف فارسی با <span>English words</span> و ادامه';
  document.querySelector('#layout .card').appendChild(mixed);
  await tick();
  check(getComputedStyle(mixed).direction==='rtl','Mixed paragraph RTL as a whole');
  let mutations=0;
  const watch = new MutationObserver(records=>{mutations+=records.length});
  watch.observe(document.body,{childList:true,subtree:true});
  await tick(); await tick();
  watch.disconnect();
  check(mutations===0,'Stable DOM: no rescan mutation loop');
  check(getComputedStyle(document.querySelector('#email')).direction==='ltr','Email unchanged');
  document.querySelector('#dynamic').textContent='دری زبان';
  await tick();
  check(!!document.querySelector('#dynamic[data-banich-rtl]'),'Dynamic text');
  document.querySelector('#field').value='English';
  document.querySelector('#field').dispatchEvent(new Event('input',{bubbles:true}));
  await tick();
  check(!document.querySelector('#field').hasAttribute('data-banich-rtl'),'Field language changed');
  apply({font:false,rtl:false});
  check(!document.querySelector('[data-banich-text]'),'Wrappers removed');
  check(original===document.querySelector('#fa').firstChild,'Original text node preserved');
  check(getComputedStyle(document.querySelector('#fa')).textAlign==='left','Alignment restored');
  (0,eval)(source);
  check(listeners.length===1,'No duplicate listeners');
  document.querySelector('#result').textContent='PASS: scripts, mixed text, icons, code, layout position, fields, dynamic content, disable restoration, duplicate guard';
})().catch(error=>{document.querySelector('#result').textContent='FAIL: '+error.message; console.error(error)});
</script>
